<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Undangan Pernikahan</title>

  <style>
    body {
      margin: 0;
      font-family: 'Georgia', serif;
      background: #f7f3ef;
      color: #333;
      text-align: center;
    }

    .hero {
      height: 100vh;
      background: url('https://images.unsplash.com/photo-1529634806980-85c3dd6d34ac') center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      flex-direction: column;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    }

    .hero h1 {
      font-size: 42px;
      margin: 0;
    }

    .hero p {
      font-size: 18px;
      margin-top: 10px;
    }

    .section {
      padding: 60px 20px;
    }

    .names {
      font-size: 32px;
      font-weight: bold;
    }

    .date {
      font-size: 20px;
      margin-top: 10px;
    }

    .box {
      background: white;
      padding: 30px;
      margin: 20px auto;
      max-width: 500px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background: #8b5e3c;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    iframe {
      width: 100%;
      height: 250px;
      border: none;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <!-- HERO -->
  <div class="hero">
    <h1>Undangan Pernikahan</h1>
    <p>Kami mengundang Anda untuk hadir di hari bahagia kami</p>
  </div>

  <!-- NAMA -->
  <div class="section">
    <div class="box">
      <div class="names">Eep Rifaldy & Melly</div>
      <div class="date">30 Mei 2026</div>
      <p>Dengan segala kerendahan hati, kami mengundang Anda untuk hadir di acara pernikahan kami.</p>
    </div>
  </div>

  <!-- COUNTDOWN SIMPLE -->
  <div class="section">
    <div class="box">
      <h3>Acara Dimulai</h3>
      <p>30 Mei 2026</p>
    </div>
  </div>

  <!-- LOKASI -->
  <div class="section">
    <div class="box">
      <h3>Lokasi Acara</h3>
      <iframe src="https://www.google.com/maps?q=Bandung&output=embed"></iframe>
      <a class="btn" href="https://maps.google.com" target="_blank">Buka Maps</a>
    </div>
  </div>

  <!-- RSVP -->
  <div class="section">
    <div class="box">
      <h3>Konfirmasi Kehadiran</h3>
      <a class="btn" href="#">RSVP Sekarang</a>
    </div>
  </div>

</body>
</html>
