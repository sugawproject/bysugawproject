<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Eep Rifaldy & Melly Wedding Cinematic</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<!-- THREE + POSTPROCESSING -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{overflow:hidden;background:#050a07;color:white;font-family:'Poppins';}
canvas{position:fixed;inset:0;}

/* LOADING SCREEN */
#loading{
position:fixed;inset:0;
background:black;
display:flex;
align-items:center;
justify-content:center;
z-index:999;
flex-direction:column;
}

#loading h1{
font-family:'Cinzel';
letter-spacing:4px;
}

.bar{
width:200px;height:2px;background:#333;margin-top:20px;
overflow:hidden;
}
.bar span{
display:block;height:100%;width:0;background:#d6c28a;
animation:load 2s forwards;
}
@keyframes load{to{width:100%;}}

/* UI */
#ui{
position:fixed;
width:100%;height:100%;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
z-index:10;
pointer-events:none;
}

.card{
max-width:700px;
padding:40px;
backdrop-filter:blur(10px);
background:rgba(255,255,255,.06);
border:1px solid rgba(255,255,255,.1);
border-radius:25px;
opacity:0;
transform:translateY(40px);
}

h1{font-family:'Cinzel';font-size:60px;}
.sub{color:#d6c28a;margin:10px 0;}
.btn{
pointer-events:auto;
margin-top:20px;
padding:12px 30px;
border:none;
border-radius:30px;
background:#d6c28a;
cursor:pointer;
font-weight:bold;
}

#musicBtn{
position:fixed;bottom:20px;right:20px;
z-index:20;
background:#ffffff22;
backdrop-filter:blur(10px);
border-radius:50%;
width:60px;height:60px;
border:none;
color:white;
font-size:20px;
}
</style>
</head>
<body>

<div id="loading">
<h1>LOADING FOREST</h1>
<div class="bar"><span></span></div>
</div>

<div id="ui">
<div class="card">
<div class="sub">THE WEDDING OF</div>
<h1>Eep & Melly</h1>
<p class="sub">31 Mei 2026 • 08.00 WIB</p>
<p id="guest">Tamu Undangan</p>
<button class="btn" onclick="openGate()">ENTER FOREST</button>
</div>
</div>

<button id="musicBtn" onclick="toggleMusic()">♫</button>

<audio id="music" loop>
<source src="musik.mp3" type="audio/mp3">
</audio>

<script>

/* SCENE */
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,1000);
camera.position.set(0,2,8);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

/* LIGHT */
const light=new THREE.PointLight(0xffe6b3,2);
light.position.set(5,5,5);
scene.add(light);
scene.add(new THREE.AmbientLight(0x224422,.5));

/* GROUND */
const ground=new THREE.Mesh(
new THREE.PlaneGeometry(100,100),
new THREE.MeshStandardMaterial({color:0x0b1a10})
);
ground.rotation.x=-Math.PI/2;
scene.add(ground);

/* TREES */
for(let i=0;i<80;i++){
const tree=new THREE.Mesh(
new THREE.CylinderGeometry(.1,.5,3,6),
new THREE.MeshStandardMaterial({color:0x1f2d1f})
);
tree.position.set((Math.random()-0.5)*50,1.5,-Math.random()*50);
scene.add(tree);
}

/* FOG */
scene.fog=new THREE.FogExp2(0x050a07,0.06);

/* PARTICLES */
const particles=[];
for(let i=0;i<200;i++){
const p=new THREE.Mesh(
new THREE.SphereGeometry(.02),
new THREE.MeshBasicMaterial({color:0xffffff})
);
p.position.set((Math.random()-0.5)*30,Math.random()*10,-Math.random()*30);
scene.add(p);
particles.push(p);
}

/* GATE (CINEMATIC DOORS) */
const gateL=new THREE.Mesh(new THREE.BoxGeometry(2,4,0.2),new THREE.MeshStandardMaterial({color:0x2b1d12}));
const gateR=gateL.clone();
gateL.position.set(-1,2,-3);
gateR.position.set(1,2,-3);
scene.add(gateL);scene.add(gateR);

/* BLOOM */
const composer=new THREE.EffectComposer(renderer);
composer.addPass(new THREE.RenderPass(scene,camera));
const bloom=new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.2,1,0.1);
composer.addPass(bloom);

/* NAME PARAM */
const params=new URLSearchParams(location.search);
if(params.get('to')) document.getElementById('guest').innerHTML=params.get('to');

/* MUSIC */
const music=document.getElementById('music');
function toggleMusic(){music.play();}

/* OPEN GATE ANIMATION */
function openGate(){

music.play();

gsap.to(gateL.position,{x:-6,duration:2});
gsap.to(gateR.position,{x:6,duration:2});

gsap.to(camera.position,{z:3,y:1.5,duration:3});

gsap.to(".card",{opacity:0,y:-50,duration:1});
setTimeout(()=>document.getElementById('ui').style.display='none',1500);
}

/* ANIMATE LOOP */
function animate(){
requestAnimationFrame(animate);
particles.forEach(p=>p.position.y-=0.02);
composer.render();
}
animate();

/* RESIZE */
addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});

/* LOADING */
setTimeout(()=>{
document.getElementById('loading').style.display='none';
gsap.to('.card',{opacity:1,y:0,duration:2});
},2000);

</script>

</body>
</html>
```
